name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '19 18 * * 6'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read

    name: Codacy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Automatically tracks updates for v4

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4 # Tracks latest patches for Codacy v4
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647
          # Keeps defaults explicitly defined to prevent internal script crashes
          upload: false
          fail-if-incomplete: false
          allow-network: false
          force-file-permissions: false

      - name: Upload Codacy SARIF results file
        uses: github/codeql-action/upload-sarif@v4 # Tracks latest patches for CodeQL v4
        with:
          sarif_file: results.sarif
          category: codacy-security-scan
          
